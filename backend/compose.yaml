services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER nao definida no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB nao definida no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  
  backend: 
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB nao definida no arquivo .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER nao definida no arquivo .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida no arquivo .env}
    depends_on:
      - db

volumes:
  postgres_data: