services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CHATBOT_HOST_PORT:-8001}:8001"
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080/api}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      PORT: "8001"
    env_file:
      - ./.env
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ollama:
    image: ollama/ollama
    environment:
      # Mantém o modelo carregado na memória entre as mensagens; sem isso,
      # o recarregamento estoura o timeout do modelo (RNF11).
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Baixa o modelo na primeira subida (fica salvo no volume) e o carrega na
  # memória antes de o chatbot começar a receber mensagens.
  ollama-init:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        (ollama show "$$LLM_MODEL" > /dev/null 2>&1 || ollama pull "$$LLM_MODEL")
        && ollama run "$$LLM_MODEL" --think=false "Responda apenas: ok" > /dev/null
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
